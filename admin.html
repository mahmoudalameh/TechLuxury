<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المطور | إدارة كروت ذكرى</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #141b2d;
            --accent-gold: #e2b714;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e374a;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-gold);
        }

        .btn-create {
            background: linear-gradient(135deg, #e2b714, #d97706);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-create:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Table Section */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Status Badge */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-available { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-disabled { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-copy { background: #334155; color: #fff; }
        .btn-copy:hover { background: #475569; }

        select.status-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-code"></i> لوحة تحكم المطور - إدارة الكروت</h1>
            <button id="btnCreateCard" class="btn-create">
                <i class="fa-solid fa-plus"></i> إنشاء كرت NFC جديد
            </button>
        </header>

        <!-- احصائيات سريعة -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الكروت</h3>
                <p id="totalCards">0</p>
            </div>
            <div class="stat-card">
                <h3>الكروت المتاحة (جديدة)</h3>
                <p id="availableCards" style="color: #60a5fa;">0</p>
            </div>
            <div class="stat-card">
                <h3>الكروت المفعلة</h3>
                <p id="activeCards" style="color: #34d399;">0</p>
            </div>
            <div class="stat-card">
                <h3>الكروت المعطلة</h3>
                <p id="disabledCards" style="color: #f87171;">0</p>
            </div>
        </div>

        <!-- جدول الكروت -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>رمز الكرت (Card ID)</th>
                        <th>الحالة (Status)</th>
                        <th>تاريخ الإنشاء</th>
                        <th>رابط NFC الخاص بالكرت</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="cardsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">جاري تحميل الكروت...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- السكربتات الخاصة بـ Firebase ولطق العمليات -->
    <script type="module" src="../js/admin.js"></script>

</body>
</html>
