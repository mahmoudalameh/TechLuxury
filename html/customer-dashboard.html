<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة ذكرياتي | إدارة القلادات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #141b2d;
            --accent-gold: #e2b714;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e374a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .claim-card-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .claim-form { display: flex; gap: 12px; margin-top: 15px; }
        .claim-form input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .btn-claim {
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .my-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            position: relative;
        }

        .my-card .card-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(226, 183, 20, 0.15);
            color: var(--accent-gold);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(226, 183, 20, 0.3);
        }

        .my-card h3 { color: var(--accent-gold); margin-top: 15px; }
        .my-card p { font-size: 0.9rem; color: var(--text-muted); }

        .btn-edit-memory {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-edit-memory:hover { background: #2563eb; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
        }

        .form-group input[type="file"] {
            background: #0f172a;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            width: 100%;
        }

        .file-status {
            font-size: 0.8rem;
            color: var(--accent-gold);
            margin-top: 4px;
            display: block;
        }

        .btn-save {
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

        /* اختيار نوع الكرت */
        .type-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .type-option {
            background: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .type-option:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
        }

        .type-option.selected {
            border-color: var(--accent-gold);
            background: rgba(226, 183, 20, 0.1);
        }

        .type-option i {
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
            display: block;
        }

        .type-option span {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .music-box {
            background: rgba(226, 183, 20, 0.08);
            border: 1px solid rgba(226, 183, 20, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.05rem;
            color: var(--accent-gold);
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .current-images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .image-thumb {
            position: relative;
            display: inline-block;
        }

        .image-thumb img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .image-thumb button {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h2>أهلاً بك في ذكرياتي 👋</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;" id="userEmail">جاري التحميل...</p>
            </div>
            <button id="btnLogout" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
        </header>

        <div class="claim-card-section">
            <h3><i class="fa-solid fa-plus-circle"></i> تفعيل كرت جديد</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">أدخل رمز الكرت المكتوب على العلبة.</p>
            <div class="claim-form">
                <input type="text" id="cardIdInput" placeholder="مثال: X7K29P4M">
                <button id="btnClaimCard" class="btn-claim">ربط الكرت</button>
            </div>
        </div>

        <h3 style="margin-bottom: 15px;">قلاداتك الذكية</h3>
        <div class="cards-grid" id="myCardsList">
            <p style="color:#94a3b8;">جاري التحميل...</p>
        </div>
    </div>

    <!-- نافذة التعديل -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fa-solid fa-pen-to-square"></i> إدارة الكرت</h3>
                <button class="modal-close" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="editCardForm">
                <input type="hidden" id="editCardId">

                <!-- 1) اختيار نوع الكرت -->
                <div id="stepTypeSelect">
                    <h3 class="section-title"><i class="fa-solid fa-list"></i> اختر نوع الكرت</h3>
                    <div class="type-selector" id="typeSelector">
                        <!-- ستُضاف أنواع الكروت هنا ديناميكياً -->
                    </div>
                    <button type="button" id="btnConfirmType" class="btn-save" style="margin-top:20px;" disabled>
                        متابعة
                    </button>
                </div>

                <!-- 2) حقول الكرت (تظهر بعد اختيار النوع) -->
                <div id="stepCardFields" class="hidden">
                    <!-- عنوان الكرت -->
                    <div class="form-group">
                        <label>عنوان الكرت</label>
                        <input type="text" id="editCardTitle" placeholder="مثال: إلى أغلى إنسانة...">
                    </div>

                    <!-- تاريخ (يظهر في أنواع معينة) -->
                    <div class="form-group" id="dateGroup">
                        <label>تاريخ المناسبة (اختياري)</label>
                        <input type="date" id="editCardDate">
                    </div>

                    <!-- الرسالة (تظهر في أنواع معينة) -->
                    <div class="form-group" id="messageGroup">
                        <label>الرسالة / الذكرى</label>
                        <textarea id="editCardMessage" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
                    </div>

                    <!-- الصور (تظهر في كل الأنواع ما عدا "كرت فيديو") -->
                    <div id="imagesSection">
                        <h3 class="section-title"><i class="fa-solid fa-images"></i> الصور</h3>

                        <div class="form-group">
                            <label>الصور المحفوظة (<span id="imagesCount">0</span>)</label>
                            <div class="current-images-container" id="currentImagesContainer"></div>
                        </div>

                        <div class="form-group">
                            <label>📤 إضافة صور جديدة</label>
                            <input type="file" id="editImages" accept="image/*" multiple>
                            <span class="file-status" id="imagesStatus"></span>
                        </div>
                    </div>

                    <!-- الفيديو (يظهر في كل الأنواع ما عدا "ألبوم صور") -->
                    <div id="videoSection">
                        <h3 class="section-title"><i class="fa-solid fa-video"></i> الفيديو</h3>
                        <div class="form-group">
                            <label>فيديو الكرت</label>
                            <input type="file" id="editVideo" accept="video/*">
                            <span class="file-status" id="videoStatus"></span>
                        </div>
                    </div>

                    <!-- الموسيقى (تظهر في كل الأنواع) -->
                    <h3 class="section-title"><i class="fa-solid fa-music"></i> موسيقى الخلفية</h3>
                    <div class="music-box">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>🎵 الموسيقى التي ستعمل تلقائياً عند فتح الكرت</label>
                            <input type="file" id="editBgMusic" accept="audio/*">
                            <span class="file-status" id="bgMusicStatus"></span>
                        </div>
                    </div>

                    <!-- سؤال الأمان (يظهر في أنواع معينة فقط) -->
                    <div id="securitySection">
                        <h3 class="section-title"><i class="fa-solid fa-lock"></i> سؤال الأمان (اختياري)</h3>
                        <div class="form-group">
                            <label>السؤال</label>
                            <input type="text" id="editSecurityQuestion" placeholder="مثال: ما هو تاريخ ميلادي؟">
                        </div>
                        <div class="form-group">
                            <label>الإجابة</label>
                            <input type="text" id="editSecurityAnswer" placeholder="الإجابة الصحيحة">
                        </div>
                    </div>

                    <!-- زر التغيير النوع -->
                    <button type="button" id="btnChangeType" style="
                        background: transparent; color: var(--text-muted);
                        border: 1px solid var(--border-color); padding: 8px 16px;
                        border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 0.85rem;
                    ">
                        <i class="fa-solid fa-arrows-rotate"></i> تغيير نوع الكرت
                    </button>

                    <button type="submit" class="btn-save" id="btnSaveData" style="margin-top:20px;">
                        <i class="fa-solid fa-floppy-disk"></i> حفظ الكرت
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/customer-dashboard.js"></script>

</body>
</html>
