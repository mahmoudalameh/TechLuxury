<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة ذكرياتي | إدارة القلادات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #141b2d;
            --accent-gold: #e2b714;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e374a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .claim-card-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .claim-form { display: flex; gap: 12px; margin-top: 15px; }
        .claim-form input, .modal-body input, .modal-body textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .btn-claim {
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .my-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .my-card h3 { color: var(--accent-gold); }
        .my-card p { font-size: 0.9rem; color: var(--text-muted); }

        .btn-edit-memory {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-edit-memory:hover { background: #2563eb; }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input[type="text"], 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
        }

        .form-group input[type="file"] {
            background: #0f172a;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            width: 100%;
        }

        .file-status {
            font-size: 0.8rem;
            color: var(--accent-gold);
            margin-top: 4px;
            display: block;
        }

        .btn-save {
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h2>أهلاً بك في ذكرياتي 👋</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;" id="userEmail">جاري التحميل...</p>
            </div>
            <button id="btnLogout" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
        </header>

        <!-- ربط كرت جديد بالحساب -->
        <div class="claim-card-section">
            <h3><i class="fa-solid fa-plus-circle"></i> تفعيل كرت جديد</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">أدخل رمز الكرت (Card ID) المكتوب على العلبة لربطه بحسابك وتعديل ذكرياته.</p>
            <div class="claim-form">
                <input type="text" id="cardIdInput" placeholder="أدخل رمز الكرت هنا (مثال: X7K29P4M)">
                <button id="btnClaimCard" class="btn-claim">ربط الكرت</button>
            </div>
        </div>

        <!-- قائمة كروت العميل -->
        <h3 style="margin-bottom: 15px;">قلاداتك الذكية</h3>
        <div class="cards-grid" id="myCardsList">
            <!-- ستظهر كروت المستخدم هنا -->
        </div>
    </div>

    <!-- نافذة تعديل الذكريات والوسائط (Modal) -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> تعديل بيانات الذكرى والوسائط</h3>
                <button class="modal-close" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="editCardForm">
                <input type="hidden" id="editCardId">
                
                <div class="form-group">
                    <label>عنوان القلادة / الكرت</label>
                    <input type="text" id="editTitle" placeholder="مثال: ذكريات خطوبتنا" required>
                </div>

                <div class="form-group">
                    <label>الرسالة / المحتوى النصي</label>
                    <textarea id="editMessage" rows="3" placeholder="اكتب الرسالة أو الذكرى هنا..."></textarea>
                </div>

                <!-- رفع صور الذكريات -->
                <div class="form-group">
                    <label><i class="fa-solid fa-images"></i> صور الذكريات (يمكنك اختيار أكثر من صورة)</label>
                    <input type="file" id="editImages" accept="image/*" multiple>
                    <span class="file-status" id="imagesStatus"></span>
                </div>

                <!-- رفع فيديو -->
                <div class="form-group">
                    <label><i class="fa-solid fa-video"></i> فيديو الذكرى (اختياري)</label>
                    <input type="file" id="editVideo" accept="video/*">
                    <span class="file-status" id="videoStatus"></span>
                </div>

                <!-- رفع موسيقى الخلفية -->
                <div class="form-group">
                    <label><i class="fa-solid fa-music"></i> موسيقى الخلفية (MP3 / Audio)</label>
                    <input type="file" id="editAudio" accept="audio/*">
                    <span class="file-status" id="audioStatus"></span>
                </div>

                <hr style="border-color: var(--border-color); margin: 20px 0;">

                <div class="form-group">
                    <label>سؤال الأمان (لفتح الذكرى)</label>
                    <input type="text" id="editSecurityQuestion" placeholder="مثال: ما هو تاريخ زواجنا؟">
                </div>

                <div class="form-group">
                    <label>إجابة سؤال الأمان</label>
                    <input type="text" id="editSecurityAnswer" placeholder="أدخل الإجابة الصحيحة لفتح الكرت">
                </div>

                <button type="submit" class="btn-save" id="btnSaveData">حفظ التغييرات ورفع الوسائط</button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/customer-dashboard.js"></script>

</body>
</html>
