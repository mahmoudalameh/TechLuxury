<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | ذِكـرى</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #141b2d;
            --accent-gold: #e2b714;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e374a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

        .auth-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header i { font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 10px; }
        .auth-header h2 { font-size: 1.5rem; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e2b714, #d97706);
            color: #000;
            border: none;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .btn-auth:hover { opacity: 0.9; }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-mode a { color: var(--accent-gold); text-decoration: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <i class="fa-solid fa-gem"></i>
            <h2 id="formTitle">تسجيل الدخول إلى حسابك</h2>
        </div>

        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>الاسم الكامل</label>
                <input type="text" id="fullName" placeholder="مثال: أحمد علي">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="btnSubmit" class="btn-auth">دخول</button>
        </form>

        <div class="toggle-mode">
            <span id="toggleText">ليس لديك حساب؟</span>
            <a id="btnToggle">إنشاء حساب جديد</a>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
