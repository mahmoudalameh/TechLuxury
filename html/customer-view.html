<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d16">
    <meta name="description" content="Tech Luxury — ذكرى لا تُنسى">
    <title>ذِكـرى | لحظة لا تُنسى</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/view.css">
</head>
<body class="view-page">

    <!-- =========================
         Loading Screen
    ========================== -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <p class="loading-text">جاري تحميل الذكرى...</p>
    </div>

    <!-- =========================
         Main Container
    ========================== -->
    <main class="view-container" id="viewContainer" style="display:none;"></main>

    <!-- =========================
         Lightbox
    ========================== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-label="عارض الصور" aria-hidden="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="إغلاق">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="lightbox-nav prev" id="lightboxPrev" aria-label="السابق">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="lightbox-stage">
            <img id="lightboxImg" src="" alt="">
        </div>
        <button class="lightbox-nav next" id="lightboxNext" aria-label="التالي">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <!-- =========================
         Music Toggle
    ========================== -->
    <button class="music-toggle" id="musicToggle" title="تشغيل الموسيقى" aria-label="تشغيل الموسيقى">
        <i class="fa-solid fa-music"></i>
    </button>

    <audio id="bgMusic" loop preload="none"></audio>

    <script type="module" src="../js/customer-view.js"></script>

</body>
</html>
